name: Python quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quality tools
        run: python -m pip install --upgrade ruff mypy

      - name: Check formatting
        run: ruff format --check .

      - name: Run Ruff linter
        run: ruff check .

      - name: Run mypy
        run: mypy --ignore-missing-imports . || echo "No Python files to check"
